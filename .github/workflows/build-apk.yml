name: Build Arabic Transliteration APK

on:
  push:
    branches:
      - 'claude/arabic-transliteration-android-*'
    paths:
      - 'ArabicTranslitKeyboard/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: ArabicTranslitKeyboard
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-transliteration-keyboard
          path: ArabicTranslitKeyboard/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Arabic Transliteration Keyboard v1.0.0
          body: |
            Android keyboard app for academic Arabic transliteration.

            **Features:**
            - Physical keyboard: RAlt + key for transliteration characters
            - On-screen keyboard with character grid
            - DIN 31635 / EI2 standard

            **Install:** Download the APK below and install on your Android device.
          files: ArabicTranslitKeyboard/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
